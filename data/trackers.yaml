# Elenco di domini di terze parti con categoria, redatto per questo progetto (stessi diritti del resto del codice).
# Non deriva da Tracker Radar, Disconnect o EasyPrivacy (licenze non compatibili con uso commerciale).
#
# Campi:
#   dominio:   host o dominio (vale anche per i sottodomini)
#   azienda:   fornitore
#   categoria: tecnico | funzionalita | statistica | marketing | registrazione-sessioni | social
#   percorsi:  (opzionale) regex sul path; se presenti, la voce vale solo per quei percorsi
#   nota:      (opzionale) testo mostrato nel report
#
# Le voci con "percorsi" vengono valutate prima di quelle senza. Vince la voce con dominio più specifico.
# Per aggiungere domini senza toccare questo file: chiave "trackerExtra" nella configurazione.

