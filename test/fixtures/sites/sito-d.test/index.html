<!doctype html><html lang="it"><head><meta charset="utf-8"><title>Sito D</title></head>
<body><h1>Sito D</h1><a href="/pagina.html">Pagina</a>
<script>
(function () {
  var P = location.port;
  var c = (document.cookie.match(/(?:^|; )consenso_d=([^;]*)/) || [])[1];
  if (c === 'si') new Image().src = 'http://pixel.adtest.example:' + P + '/tr?d=1';
  if (c) return;
  var f = document.createElement('iframe');
  f.src = 'http://cmp.sito-d.test:' + P + '/banner.html';
  f.style.cssText = 'position:fixed;bottom:0;left:0;width:100%;height:140px;border:0;z-index:9999';
  document.body.appendChild(f);
  window.addEventListener('message', function (e) {
    if (e.data !== 'si' && e.data !== 'no') return;
    document.cookie = 'consenso_d=' + e.data + '; max-age=15552000; path=/';
    f.remove();
  });
})();
</script></body></html>
